<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshThatWorks — join the mesh</title>
<style>
  :root { --bg:#0b0e14; --card:#131826; --deep:#0e1220; --line:#232b3d; --txt:#e8ecf4;
          --dim:#8b95ab; --acc:#5eead4; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding:16px; }
  .wrap { max-width:760px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:18px; margin:4px 0 0; font-weight:600; } h1 span { color:var(--acc); }
  .sub { color:var(--dim); font-size:13px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  label { display:block; color:var(--dim); font-size:12px; margin:8px 0 4px; }
  input, select, button { font:inherit; border-radius:8px; border:1px solid var(--line);
         background:var(--deep); color:var(--txt); padding:10px 12px; width:100%; }
  button { background:var(--acc); color:#06251f; border:none; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  .bar { height:6px; background:var(--deep); border-radius:3px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  .roster div { display:flex; justify-content:space-between; gap:8px; padding:4px 0;
                border-bottom:1px dashed var(--line); font-size:13px; }
  .roster div:last-child { border-bottom:none; }
  .tag { color:var(--dim); } .ok { color:var(--acc); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  #log { display:flex; flex-direction:column; gap:12px; }

  /* round card */
  .q { font-weight:600; font-size:15px; margin-bottom:10px; }
  .stage { display:flex; gap:10px; align-items:baseline; padding:5px 0; font-size:13px;
           color:var(--dim); }
  .stage .num { flex:0 0 18px; color:var(--line); font-weight:700; }
  .stage.on { color:var(--txt); } .stage.on .num { color:var(--acc); }
  .chips { display:inline-flex; gap:6px; flex-wrap:wrap; }
  .chip { background:var(--deep); border:1px solid var(--line); border-radius:20px;
          padding:1px 10px; font-size:12px; color:var(--dim); }
  .chip.done { color:var(--acc); border-color:#2a4f48; }
  .chip.fail { color:var(--bad); }

  .prose { font-family:-apple-system, "Segoe UI", system-ui, sans-serif;
           font-size:15.5px; line-height:1.6; }
  .mesh-ans { border:1px solid var(--acc); background:linear-gradient(180deg,#12211f,#101724);
              border-radius:12px; padding:14px 16px; margin-top:12px; }
  .mesh-ans .hd { font-size:11px; letter-spacing:2px; color:var(--acc); margin-bottom:8px;
                  font-weight:700; }
  .own-ans { border:1px solid var(--line); background:var(--deep); border-radius:12px;
             padding:12px 16px; margin-top:8px; }
  .own-ans .hd { font-size:11px; letter-spacing:2px; color:var(--dim); margin-bottom:8px;
                 font-weight:700; }
  .byline { color:var(--dim); font-size:12.5px; margin-top:10px; }
  details { margin-top:10px; }
  summary { color:var(--dim); font-size:12.5px; cursor:pointer; }
  .node-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
               gap:8px; margin-top:10px; }
  .node-card { background:var(--deep); border:1px solid var(--line); border-radius:10px;
               padding:10px 12px; font-size:12.5px; }
  .node-card.selected { border-color:var(--acc); }
  .node-card b { color:var(--dim); font-weight:600; display:block; font-size:12px; }
  .node-card .va { display:inline-block; margin:2px 0 6px; padding:0 8px; border-radius:10px;
                   background:var(--card); border:1px solid var(--line); color:var(--warn);
                   font-size:11px; }
  .node-card .prose { font-size:13.5px; color:#c9d1e0; max-height:150px; overflow:auto; }
  .hidden { display:none !important; }
  small { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>mesh<span>that</span>works</h1>
  <div class="sub">every device answers alone · the mesh finds where they disagree ·
    the steadiest device reads all answers and writes one better one</div>

  <div class="card" id="join-card">
    <div class="row">
      <div><label>your name</label><input id="name" placeholder="mrunal-phone" maxlength="24"></div>
      <div><label>model for this device</label><select id="model"></select></div>
    </div>
    <div style="margin-top:10px"><button id="join">load model &amp; join mesh</button></div>
    <div class="bar"><i id="prog"></i></div>
    <div id="load-status" class="tag" style="margin-top:6px;font-size:12.5px">checking this device…</div>
  </div>

  <div class="card">
    <b style="font-size:13px">mesh</b>
    <div class="roster" id="roster"><div><span class="tag">connecting…</span></div></div>
  </div>

  <div class="card">
    <div class="row">
      <input id="q" placeholder="ask the mesh anything">
      <button id="ask" style="flex:0 0 90px">ask</button>
    </div>
  </div>

  <div id="log"></div>
</div>

<script type="module">
const MODELS = [
  // backend webllm = WebGPU (fast). backend wasm = transformers.js, runs anywhere.
  {id:"SmolLM2-360M-Instruct-q4f16_1-MLC", label:"SmolLM2 360M — phone", backend:"webllm", family:"smollm"},
  {id:"Qwen2.5-0.5B-Instruct-q4f16_1-MLC", label:"Qwen2.5 0.5B — phone", backend:"webllm", family:"qwen"},
  {id:"Llama-3.2-1B-Instruct-q4f16_1-MLC", label:"Llama 3.2 1B — phone/laptop", backend:"webllm", family:"llama"},
  {id:"Qwen2.5-1.5B-Instruct-q4f16_1-MLC", label:"Qwen2.5 1.5B — laptop", backend:"webllm", family:"qwen"},
  {id:"gemma-2-2b-it-q4f16_1-MLC",         label:"Gemma 2 2B — laptop", backend:"webllm", family:"gemma"},
  {id:"Phi-3.5-mini-instruct-q4f16_1-MLC", label:"Phi 3.5 mini — beefy laptop", backend:"webllm", family:"phi"},
  {id:"HuggingFaceTB/SmolLM2-135M-Instruct", label:"SmolLM2 135M — any device, no GPU", backend:"wasm", family:"smollm"},
  {id:"HuggingFaceTB/SmolLM2-360M-Instruct", label:"SmolLM2 360M — any device, no GPU", backend:"wasm", family:"smollm"},
  {id:"onnx-community/Qwen2.5-0.5B-Instruct", label:"Qwen2.5 0.5B — any device, no GPU", backend:"wasm", family:"qwen"},
];
const MOCK = new URLSearchParams(location.search).get("mock") === "1";
const $ = id => document.getElementById(id);
const isPhone = /Android|iPhone|iPad/i.test(navigator.userAgent);

let hasGPU = false;
try { hasGPU = !!(navigator.gpu && await navigator.gpu.requestAdapter()); } catch {}

const modelSel = $("model");
{
  const gGPU = document.createElement("optgroup"); gGPU.label = "GPU — fast (WebGPU)";
  const gCPU = document.createElement("optgroup"); gCPU.label = "no GPU needed — slower (WASM)";
  MODELS.forEach((m, i) => {
    const o = document.createElement("option");
    o.value = i; o.textContent = m.label;
    if (m.backend === "webllm") { o.disabled = !hasGPU; gGPU.appendChild(o); }
    else gCPU.appendChild(o);
  });
  modelSel.append(gGPU, gCPU);
}
$("load-status").textContent = hasGPU
  ? "WebGPU available — fast models will work on this device"
  : "no WebGPU here — using the no-GPU models (slower but they work everywhere)";

let ws, gen = null, nodeId = null, registered = false, joined = null, pinger = null,
    rosterNodes = [], touched = false;
modelSel.addEventListener("change", () => { touched = true; });

function pickSuggestion() {
  const present = new Set();
  for (const n of rosterNodes)
    for (const m of MODELS)
      if (n.model === m.id || n.model.toLowerCase().includes(m.family)) present.add(m.family);
  const usable = MODELS.map((m, i) => [m, i])
    .filter(([m]) => (m.backend === "webllm") === hasGPU || m.backend === "wasm" && !hasGPU);
  const fresh = usable.find(([m]) => !present.has(m.family) &&
    (isPhone ? !m.label.includes("laptop") : true));
  modelSel.value = (fresh || usable[0])[1];
}

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => setTimeout(connect, 2000);
  ws.onopen = () => {
    if (registered) register();
    if (!pinger) pinger = setInterval(() => {
      try { ws.send(JSON.stringify({type:"ping"})); } catch {} }, 20000);
  };
}
connect();

function register() {
  ws.send(JSON.stringify({
    type:"register",
    name: $("name").value || (isPhone ? "phone" : "laptop"),
    model: MOCK ? "mock" : joined.id.split("/").pop().replace("-q4f16_1-MLC",""),
    device: isPhone ? "phone" : "laptop",
    backend: MOCK ? "mock" : joined.backend,
  }));
}

$("join").onclick = async () => {
  $("join").disabled = true;
  if (MOCK) { joined = {id:"mock", backend:"mock"}; register(); registered = true;
              $("load-status").textContent = "mock node joined"; return; }
  const m = MODELS[+modelSel.value];
  try {
    if (m.backend === "webllm") {
      $("load-status").textContent = "loading WebLLM…";
      const webllm = await import("https://esm.run/@mlc-ai/web-llm");
      const eng = await webllm.CreateMLCEngine(m.id, { initProgressCallback: p => {
        $("prog").style.width = Math.round(p.progress*100) + "%";
        $("load-status").textContent = p.text; }});
      gen = async (prompt, temp, max) => {
        const r = await eng.chat.completions.create({
          messages:[{role:"user", content:prompt}],
          temperature: temp === 0 ? 0.001 : temp, max_tokens: max });
        return { text: r.choices[0].message.content,
                 tokens: r.usage ? r.usage.total_tokens : 0 };
      };
    } else {
      $("load-status").textContent = "loading transformers.js (no GPU needed)…";
      const tjs = await import("https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.5.1");
      const pipe = await tjs.pipeline("text-generation", m.id, {
        dtype: "q4", device: "wasm",
        progress_callback: p => { if (p.progress) {
          $("prog").style.width = Math.round(p.progress) + "%";
          $("load-status").textContent = `${p.file || ""} ${Math.round(p.progress)}%`; }}});
      gen = async (prompt, temp, max) => {
        const out = await pipe([{role:"user", content:prompt}], {
          max_new_tokens: max, temperature: temp || undefined,
          do_sample: temp > 0, top_p: 0.95 });
        const g = out[0].generated_text;
        const text = Array.isArray(g) ? g.at(-1).content : String(g);
        return { text, tokens: Math.round((prompt.length + text.length) / 4) };
      };
    }
    joined = m;
    $("load-status").textContent = "model ready — joined the mesh";
    register(); registered = true;
  } catch (err) {
    $("load-status").innerHTML = `<span class="bad">${err}</span>`;
    $("join").disabled = false;
  }
};

$("ask").onclick = () => {
  const q = $("q").value.trim();
  if (!q) return;
  ws.send(JSON.stringify({type:"ask", question:q}));
  $("q").value = "";
};
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("ask").onclick(); });

async function mockGen(prompt, temp) {
  await new Promise(r => setTimeout(r, 250 + Math.random()*400));
  const pool = ["A shared digital ledger kept in sync across many computers.",
                "A cryptographically linked chain of records nobody can silently edit."];
  return { text: temp === 0 ? pool[0] : pool[Math.floor(Math.random()*pool.length)],
           tokens: 14 };
}

async function handleGenerate(msg) {
  ws.send(JSON.stringify({type:"status", status:"busy"}));
  try {
    const g = MOCK ? mockGen : gen;
    const answer = await g(msg.answer_prompt, msg.kind === "second" ? 0 : 0, msg.answer_max_tokens);
    const probes = [];
    for (let k = 0; k < msg.k_probes; k++)
      probes.push(await g(msg.probe_prompt, msg.temperature, msg.probe_max_tokens));
    ws.send(JSON.stringify({type:"generation", req_id: msg.req_id, answer, probes}));
  } catch (err) { console.error(err); }
  finally { ws.send(JSON.stringify({type:"status", status:"ready"})); }
}

// ---------- round UI ----------
const rounds = {};
function roundEl(rid) {
  if (!rounds[rid]) {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="q"></div>
      <div class="stage s1"><span class="num">1</span><span class="t">every device answers on its own
        &nbsp;<span class="chips"></span></span></div>
      <div class="stage s2"><span class="num">2</span><span class="t">the mesh compares the answers…</span></div>
      <div class="stage s3"><span class="num">3</span><span class="t"></span></div>
      <div class="result"></div>`;
    el.querySelector(".s3").style.display = "none";
    $("log").prepend(el);
    rounds[rid] = el;
  }
  return rounds[rid];
}

function esc(s){ const d=document.createElement("div"); d.textContent=s??""; return d.innerHTML; }

function handle(msg) {
  if (msg.type === "generate") return handleGenerate(msg);
  if (msg.type === "registered") { nodeId = msg.node_id; return; }
  if (msg.type === "roster") {
    rosterNodes = msg.nodes;
    if (!registered && !touched) pickSuggestion();
    $("roster").innerHTML = msg.nodes.length
      ? msg.nodes.map(n => `<div><span>${esc(n.name)}${n.id===nodeId?" (you)":""}</span>
          <span class="tag">${esc(n.model)} · ${n.device} ·
          <span class="${n.status==='ready'?'ok':'warn'}">${n.status}</span></span></div>`).join("")
      : `<div><span class="tag">no devices yet — open this page on your phones &amp; laptops</span></div>`;
    return;
  }
  if (msg.type === "error") { alert(msg.message); return; }
  if (msg.type !== "round") return;

  const el = roundEl(msg.round);
  if (msg.phase === "fanout") {
    $("ask").disabled = true;
    el.querySelector(".q").textContent = "Q: " + msg.question;
    el.querySelector(".s1").classList.add("on");
    el.querySelector(".s1 .chips").innerHTML = msg.nodes.map(n =>
      `<span class="chip" data-nid="${n.id}">${esc(n.name)} ⋯</span>`).join("");
  } else if (msg.phase === "node_done") {
    const c = el.querySelector(`.chip[data-nid="${msg.node}"]`);
    if (c) { c.classList.add(msg.ok ? "done" : "fail");
             c.textContent = `${msg.name} ${msg.ok ? "✓" : "✗ no answer"}`; }
  } else if (msg.phase === "analysis") {
    el.querySelector(".s2").classList.add("on");
    el.querySelector(".s2 .t").innerHTML = msg.gap
      ? `<span class="warn">devices disagree — ${msg.n_views} different views</span>`
      : `<span class="ok">all devices see it the same way</span>`;
    el.dataset.perNode = JSON.stringify(msg.per_node);
  } else if (msg.phase === "second_pass") {
    const s3 = el.querySelector(".s3");
    s3.style.display = ""; s3.classList.add("on");
    s3.querySelector(".t").innerHTML =
      `<b>${esc(msg.name)}</b> (${esc(msg.reason)}) is reading everyone's answers and writing the final one…`;
  } else if (msg.phase === "final") {
    renderFinal(el, msg);
  } else if (msg.phase === "error") {
    $("ask").disabled = false;
    el.querySelector(".result").innerHTML = `<div class="bad" style="margin-top:8px">${esc(msg.message)}</div>`;
  }
}

function renderFinal(el, msg) {
  $("ask").disabled = false;
  const mine = msg.per_node[nodeId];
  const by = msg.final_how === "synthesized"
    ? `written by <b>${esc(msg.final_by.name)}</b> (${esc(msg.final_by.model)}) after reading all ${Object.keys(msg.per_node).length} answers`
    : msg.final_how === "consensus"
    ? `all devices agreed — steadiest answer shown (${esc(msg.final_by.name)})`
    : `${esc(msg.final_by.name)}'s answer (${esc(msg.final_how)})`;

  let html = `
    <div class="mesh-ans"><div class="hd">THE MESH'S ANSWER</div>
      <div class="prose">${esc(msg.final)}</div>
      <div class="byline">${by} · ${msg.total_tokens} tokens · ${msg.elapsed_s}s</div>
    </div>`;
  if (mine) html += `
    <div class="own-ans"><div class="hd">YOUR DEVICE ALONE (${esc(mine.model)})</div>
      <div class="prose">${esc(mine.answer)}</div>
    </div>`;
  html += `
    <details><summary>how the mesh got there — every device's answer</summary>
      <div class="node-grid">${Object.entries(msg.per_node).map(([nid, a]) => `
        <div class="node-card${nid === msg.final_by.id ? " selected" : ""}">
          <b>${esc(a.name)} · ${esc(a.model)}</b>
          <span class="va">view ${a.view}</span>${nid === msg.final_by.id ? `<span class="va" style="color:var(--acc)">synthesizer</span>` : ""}
          <div class="prose">${esc(a.answer)}</div>
          <small>one-liners: ${a.probes.map(esc).join(" · ")}</small><br>
          <small>steadiness H=${a.entropy_raw}${a.calibrated ? ` (z=${a.entropy_z})` : ""} · ${a.tokens} tok</small>
        </div>`).join("")}
      </div>
    </details>`;
  el.querySelector(".result").innerHTML = html;
}
</script>
</body>
</html>
