<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MeshThatWorks — join the mesh</title>
<style>
  :root { --bg:#0b0e14; --card:#131826; --line:#232b3d; --txt:#e8ecf4; --dim:#8b95ab;
          --acc:#5eead4; --warn:#fbbf24; --bad:#f87171; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font:15px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; padding:16px; }
  .wrap { max-width:780px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:18px; margin:4px 0 0; font-weight:600; }
  h1 span { color:var(--acc); }
  .sub { color:var(--dim); font-size:13px; margin-bottom:4px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  label { display:block; color:var(--dim); font-size:12px; margin:8px 0 4px; }
  input, select, button { font:inherit; border-radius:8px; border:1px solid var(--line);
         background:#0e1220; color:var(--txt); padding:9px 12px; width:100%; }
  button { background:var(--acc); color:#06251f; border:none; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .row { display:flex; gap:8px; }
  .row > * { flex:1; }
  .bar { height:6px; background:#0e1220; border-radius:3px; overflow:hidden; margin-top:8px; }
  .bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .3s; }
  .roster div { display:flex; justify-content:space-between; gap:8px; padding:4px 0;
                border-bottom:1px dashed var(--line); font-size:13px; }
  .roster div:last-child { border-bottom:none; }
  .tag { color:var(--dim); }
  .ok { color:var(--acc); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  #log { display:flex; flex-direction:column; gap:10px; }
  .node-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr));
               gap:8px; margin-top:8px; }
  .node-card { background:#0e1220; border:1px solid var(--line); border-radius:8px;
               padding:10px; font-size:13px; }
  .node-card.selected { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc); }
  .node-card b { font-size:12px; color:var(--dim); font-weight:500; display:block; }
  .ans { font-size:14px; margin:4px 0; word-break:break-word; }
  .final { font-size:17px; }
  .final b { color:var(--acc); }
  .phase { color:var(--dim); font-size:12px; }
  .hidden { display:none !important; }
  small { color:var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>mesh<span>that</span>works</h1>
  <div class="sub">adaptive collective inference — every device runs a complete small model;
    the mesh measures where it disagrees and asks exactly one node to resolve it.</div>

  <div class="card" id="join-card">
    <div class="row">
      <div><label>your name</label><input id="name" placeholder="mrunal-phone" maxlength="24"></div>
      <div><label>model (runs in this browser)</label><select id="model"></select></div>
    </div>
    <div style="margin-top:10px"><button id="join">load model &amp; join mesh</button></div>
    <div class="bar"><i id="prog"></i></div>
    <div id="load-status" class="phase" style="margin-top:6px">
      needs WebGPU — recent Chrome/Edge/Safari. Phones must open the HTTPS link.</div>
  </div>

  <div class="card">
    <b style="font-size:13px">mesh</b>
    <div class="roster" id="roster"><div><span class="tag">connecting…</span></div></div>
  </div>

  <div class="card">
    <div class="row">
      <input id="q" placeholder="ask the mesh anything (short-answer questions work best)">
      <button id="ask" style="flex:0 0 90px">ask</button>
    </div>
  </div>

  <div id="log"></div>
</div>

<script type="module">
const MODELS = [
  ["SmolLM2-360M-Instruct-q4f16_1-MLC",      "SmolLM2 360M — tiny, any phone"],
  ["Qwen2.5-0.5B-Instruct-q4f16_1-MLC",      "Qwen2.5 0.5B — phone"],
  ["Llama-3.2-1B-Instruct-q4f16_1-MLC",      "Llama 3.2 1B — phone/laptop"],
  ["Qwen2.5-1.5B-Instruct-q4f16_1-MLC",      "Qwen2.5 1.5B — laptop"],
  ["gemma-2-2b-it-q4f16_1-MLC",              "Gemma 2 2B — laptop"],
  ["Phi-3.5-mini-instruct-q4f16_1-MLC",      "Phi 3.5 mini — beefy laptop"],
];
const MOCK = new URLSearchParams(location.search).get("mock") === "1";
const $ = id => document.getElementById(id);
const modelSel = $("model");
for (const [id, label] of MODELS) {
  const o = document.createElement("option"); o.value = id; o.textContent = label;
  modelSel.appendChild(o);
}
// rough auto-pick: phones get small, laptops get bigger
const isPhone = /Android|iPhone|iPad/i.test(navigator.userAgent);
modelSel.selectedIndex = isPhone ? 1 : 3;

let ws, engine = null, nodeId = null, registered = false, joinedModel = null, pinger = null;

function connect() {
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws`);
  ws.onmessage = e => handle(JSON.parse(e.data));
  ws.onclose = () => { setTimeout(connect, 2000); };
  ws.onopen = () => {
    if (registered) register();       // re-register after reconnect
    if (!pinger)
      pinger = setInterval(() => { try { ws.send(JSON.stringify({type:"ping"})); } catch {} }, 20000);
  };
}
connect();

function register() {
  ws.send(JSON.stringify({
    type: "register",
    name: $("name").value || (isPhone ? "phone" : "laptop"),
    model: MOCK ? "mock" : (joinedModel || modelSel.value),
    device: isPhone ? "phone" : "laptop",
  }));
}

$("join").onclick = async () => {
  $("join").disabled = true;
  if (MOCK) { register(); registered = true; $("load-status").textContent = "mock node joined"; return; }
  try {
    $("load-status").textContent = "loading WebLLM…";
    const webllm = await import("https://esm.run/@mlc-ai/web-llm");
    joinedModel = modelSel.value;
    engine = await webllm.CreateMLCEngine(joinedModel, {
      initProgressCallback: p => {
        $("prog").style.width = Math.round(p.progress * 100) + "%";
        $("load-status").textContent = p.text;
      },
    });
    $("load-status").textContent = "model ready — joined the mesh";
    register(); registered = true;
  } catch (err) {
    $("load-status").innerHTML = `<span class="bad">${err}</span>`;
    $("join").disabled = false;
  }
};

$("ask").onclick = () => {
  const q = $("q").value.trim();
  if (!q) return;
  ws.send(JSON.stringify({type:"ask", question:q}));
  $("q").value = "";
};
$("q").addEventListener("keydown", e => { if (e.key === "Enter") $("ask").onclick(); });

// ---------- generation ----------
async function generateOne(prompt, temperature, max_tokens, seed) {
  if (MOCK) {
    await new Promise(r => setTimeout(r, 300 + Math.random()*500));
    // deterministic-ish disagreement: mock nodes answer from a tiny pool
    const pool = ["42", "42", "42", "41"];
    const pick = temperature === 0 ? pool[0]
                : pool[Math.floor(Math.random()*pool.length)];
    return { text: pick, tokens: 8 };
  }
  const r = await engine.chat.completions.create({
    messages: [{role:"user", content: prompt}],
    temperature: temperature === 0 ? 0.001 : temperature,
    max_tokens, seed,
  });
  return { text: r.choices[0].message.content,
           tokens: r.usage ? r.usage.total_tokens : 0 };
}

async function handleGenerate(msg) {
  ws.send(JSON.stringify({type:"status", status:"busy"}));
  try {
    const greedy = await generateOne(msg.prompt, 0, msg.max_tokens);
    const samples = [];
    for (let k = 0; k < msg.k_samples; k++)
      samples.push(await generateOne(msg.prompt, msg.temperature, msg.max_tokens, 1000+k));
    ws.send(JSON.stringify({type:"generation", req_id: msg.req_id, greedy, samples}));
  } catch (err) {
    console.error(err);
  } finally {
    ws.send(JSON.stringify({type:"status", status:"ready"}));
  }
}

// ---------- UI ----------
const rounds = {};
function roundEl(rid) {
  if (!rounds[rid]) {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `<div class="q" style="font-weight:600"></div>
      <div class="phase"></div><div class="node-grid"></div><div class="final"></div>`;
    $("log").prepend(el);
    rounds[rid] = el;
  }
  return rounds[rid];
}

function handle(msg) {
  if (msg.type === "generate") return handleGenerate(msg);
  if (msg.type === "registered") { nodeId = msg.node_id; return; }
  if (msg.type === "roster") {
    $("roster").innerHTML = msg.nodes.length
      ? msg.nodes.map(n => `<div><span>${n.name}${n.id===nodeId?" (you)":""}</span>
          <span class="tag">${n.model.split("-q4")[0]} · ${n.device} ·
          <span class="${n.status==='ready'?'ok':'warn'}">${n.status}</span></span></div>`).join("")
      : `<div><span class="tag">no nodes yet — open this page on your other devices</span></div>`;
    return;
  }
  if (msg.type === "error") { alert(msg.message); return; }
  if (msg.type !== "round") return;

  const el = roundEl(msg.round);
  const phase = el.querySelector(".phase");
  if (msg.phase === "fanout") {
    el.querySelector(".q").textContent = "Q: " + msg.question;
    phase.textContent = `fan-out → ${msg.nodes.length} nodes × (1 greedy + ${msg.k} samples)…`;
  } else if (msg.phase === "analysis") {
    const grid = el.querySelector(".node-grid");
    grid.innerHTML = "";
    for (const [nid, a] of Object.entries(msg.per_node)) {
      const d = document.createElement("div");
      d.className = "node-card"; d.dataset.nid = nid;
      d.innerHTML = `<b>${a.name} · ${a.model.split("-q4")[0]}</b>
        <div class="ans">${a.greedy_answer ?? "∅"}</div>
        <small>samples: ${a.sample_answers.map(s=>s??"∅").join(" · ")}</small><br>
        <small>H=${a.entropy_raw}${a.calibrated ? ` (z=${a.entropy_z})` : " (uncalib)"}
        · ${a.tokens} tok</small>`;
      grid.appendChild(d);
    }
    phase.innerHTML = msg.gap
      ? `<span class="warn">gap detected — ${msg.n_greedy_clusters} semantic clusters</span>`
      : `<span class="ok">consensus — no second pass needed</span>`;
  } else if (msg.phase === "second_pass") {
    const c = el.querySelector(`[data-nid="${msg.selected}"]`);
    if (c) c.classList.add("selected");
    phase.innerHTML += ` → <span class="ok">second pass → ${msg.selected===nodeId?"YOU":"selected node"}</span>
      <small>(${msg.reason})</small>`;
  } else if (msg.phase === "final") {
    el.querySelector(".final").innerHTML =
      `<b>${msg.final ?? "no answer"}</b>
       <small> · ${msg.total_tokens} tok · ${msg.elapsed_s}s
       ${msg.gap ? "· 1 targeted second pass" : "· first pass only"}</small>`;
  } else if (msg.phase === "node_timeout") {
    phase.innerHTML += ` <span class="bad">node timeout</span>`;
  } else if (msg.phase === "error") {
    phase.innerHTML = `<span class="bad">${msg.message}</span>`;
  }
}
</script>
</body>
</html>
