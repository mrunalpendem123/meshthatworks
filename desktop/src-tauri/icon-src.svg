<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10131f"/>
      <stop offset="1" stop-color="#05060d"/>
    </linearGradient>
    <radialGradient id="aurora" cx="0.5" cy="0.18" r="0.7">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#46d6c8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#05060d" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS squircle -->
  <rect x="92" y="92" width="840" height="840" rx="196" fill="url(#bg)"/>
  <rect x="92" y="92" width="840" height="840" rx="196" fill="url(#aurora)"/>
  <rect x="93" y="93" width="838" height="838" rx="195" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="2"/>

  <!-- mesh: nodes wired, top node lit green -->
  <g transform="translate(512,512)" stroke="rgba(255,255,255,0.30)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M-200,-100 L0,-210 L200,-100 M-200,-100 L-200,150 L0,250 M200,-100 L200,150 L0,250 M-200,-100 L200,150 M200,-100 L-200,150"/>
  </g>
  <g transform="translate(512,512)">
    <circle cx="0" cy="-210" r="64" fill="#5ce8a6" filter="url(#glow)"/>
    <circle cx="-200" cy="-100" r="46" fill="#eef1f8"/>
    <circle cx="200" cy="-100" r="46" fill="#eef1f8"/>
    <circle cx="-200" cy="150" r="46" fill="#aab2ca"/>
    <circle cx="200" cy="150" r="46" fill="#aab2ca"/>
    <circle cx="0" cy="250" r="46" fill="#aab2ca"/>
  </g>
</svg>
